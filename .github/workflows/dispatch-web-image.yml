name: Dispatch Complete Web Image Build

on:
  create:
  workflow_run:
    workflows:
      - JumpServer repos generic handler
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: Lina branch, tag, or commit SHA
        required: true
        default: dev
        type: string
      tag:
        description: Final Web image tag
        required: true
        default: dev-manual
        type: string

permissions:
  contents: read

concurrency:
  group: dispatch-web-${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: jumpserver-east/docker-web/.github/workflows/reusable-web-dispatch.yml@docker-build
    with:
      component: lina
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_sha || github.event.ref }}
      source_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch || github.event.ref }}
      image_tag: ${{ inputs.tag }}
    secrets:
      DOCKER_WEB_DISPATCH_TOKEN: ${{ secrets.DOCKER_WEB_DISPATCH_TOKEN }}
