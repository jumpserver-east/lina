name: Dispatch Complete Web Image Build

on:
  push:
    branches-ignore:
      - main
      - master
      - docker-build
      - dev
      - v**
  workflow_dispatch:
    inputs:
      branch:
        description: Lina branch, tag, or commit SHA
        required: true
        default: dev
        type: string
      tag:
        description: Final Web image tag
        required: true
        default: dev-manual
        type: string

permissions:
  contents: read

concurrency:
  group: dispatch-web-${{ inputs.tag || github.sha }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'branch' &&
       github.ref_name != 'main' && github.ref_name != 'master' &&
       github.ref_name != 'docker-build' && github.ref_name != 'dev' &&
       !startsWith(github.ref_name, 'v'))
    uses: jumpserver-east/docker-web/.github/workflows/reusable-web-dispatch.yml@docker-build
    with:
      component: lina
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
      source_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      image_tag: ${{ inputs.tag }}
      actor: ${{ github.triggering_actor || github.actor }}
      event: ${{ github.event_name }}
    secrets:
      DOCKER_WEB_DISPATCH_TOKEN: ${{ secrets.DOCKER_WEB_DISPATCH_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_RECIPIENTS_JSON: ${{ secrets.MAIL_RECIPIENTS_JSON }}
